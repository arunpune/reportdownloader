{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-5 col-md-7">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4">

                <h2 class="fw-bold mb-2">
                    Change Password
                </h2>

                <p class="text-secondary mb-4">
                    Set a new password for your account.
                </p>

                <form method="post">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Current Password
                        </label>

                        <input
                            class="form-control"
                            type="password"
                            name="current_password"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            New Password
                        </label>

                        <input
                            class="form-control"
                            type="password"
                            name="new_password"
                            minlength="12"
                            required
                        >

                        <div class="form-text">
                            Minimum 12 characters.
                        </div>

                    </div>


                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Confirm New Password
                        </label>

                        <input
                            class="form-control"
                            type="password"
                            name="confirm_password"
                            minlength="12"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Change Password
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
