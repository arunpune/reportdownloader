{% extends "base.html" %}
{% block content %}
<div class="mb-4">
  <h1 class="fw-bold mb-1">Administration</h1>
  <p class="text-secondary mb-0">Manage portal access and organization configuration.</p>
</div>
<div class="row g-4 mb-4">
  <div class="col-md-4"><div class="card border-0 shadow-sm"><div class="card-body"><div class="text-secondary">Companies</div><div class="display-6 fw-bold">{{ companies }}</div></div></div></div>
  <div class="col-md-4"><div class="card border-0 shadow-sm"><div class="card-body"><div class="text-secondary">Users</div><div class="display-6 fw-bold">{{ users }}</div></div></div></div>
  <div class="col-md-4"><div class="card border-0 shadow-sm"><div class="card-body"><div class="text-secondary">Reports</div><div class="display-6 fw-bold">{{ reports }}</div></div></div></div>
</div>
<div class="d-flex gap-2 flex-wrap">
  <a class="btn btn-primary" href="{{ url_for('admin.users') }}">Manage Users</a>
  {% if session.get('role') == 'SUPER_ADMIN' %}
  <a class="btn btn-outline-primary" href="{{ url_for('admin.companies') }}">Manage Companies</a>
  {% endif %}
  <a class="btn btn-outline-secondary" href="{{ url_for('reports.list_reports') }}">View Reports</a>
</div>
{% endblock %}
