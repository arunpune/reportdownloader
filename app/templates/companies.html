{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-end mb-4">
<div><h1 class="fw-bold mb-1">Companies</h1><p class="text-secondary mb-0">Manage organizations available to the portal.</p></div>
<a class="btn btn-primary" href="{{ url_for('admin.new_company') }}">Create Company</a>
</div>
<div class="card border-0 shadow-sm">
<div class="table-responsive">
<table class="table table-hover align-middle mb-0">
<thead class="table-light"><tr><th>Name</th><th>Code</th><th>Status</th><th class="text-end">Action</th></tr></thead>
<tbody>
{% for company in companies %}
<tr>
<td class="fw-semibold">{{ company.name }}</td><td>{{ company.code }}</td>
<td>{% if company.is_active %}<span class="badge text-bg-success">Active</span>{% else %}<span class="badge text-bg-secondary">Disabled</span>{% endif %}</td>
<td class="text-end">
<form method="post" action="{{ url_for('admin.toggle_company', company_id=company.id) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<button class="btn btn-sm btn-outline-secondary">Enable/Disable</button>
</form>
</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
</div>
{% endblock %}
